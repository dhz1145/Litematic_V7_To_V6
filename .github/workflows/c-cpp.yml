name: C/C++ CI

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'
  # push:
  #   branches: [ "master" ]
  # pull_request:
  #   branches: [ "master" ]

jobs:
  build:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows
            target: native
            arch: x64
            runner: windows-latest
          - os: windows
            target: native
            arch: arm64
            runner: windows-latest
          - os: linux
            target: native
            arch: x64
            runner: ubuntu-latest
          - os: linux
            target: native
            arch: arm64
            runner: ubuntu-24.04-arm
          - os: linux
            target: android
            arch: x64
            runner: ubuntu-latest
          - os: linux
            target: android
            arch: arm64
            runner: ubuntu-latest
          - os: macos
            target: native
            arch: arm64
            runner: macos-latest
          - os: macos
            target: native
            arch: x64
            runner: macos-latest

    steps:
      - uses: actions/checkout@v6

      # Setup Windows
      - name: Setup MSVC (Windows native x64 & arm64)
        if: runner.os == 'Windows' && matrix.target == 'native'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.arch == 'x64' && 'x64' || 'amd64_arm64' }}

      # Setup Linux
      - name: Setup GCC (Linux native x64 & arm64)
        if: runner.os == 'Linux' && matrix.target == 'native'
        uses: aminya/setup-cpp@v1
        with:
          compiler: gcc
          cmake: true

      # Setup macOS
      - name: Setup Clang (macOS native x64 & arm64)
        if: runner.os == 'macOS' && matrix.target == 'native'
        uses: aminya/setup-cpp@v1
        with:
            compiler: apple-clang
            cmake: true

      # Setup Android
      - name: Setup Android NDK (Linux android x64 & arm64)
        if: runner.os == 'Linux' && matrix.target == 'android'
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26d

      # Build Windows: MSVC (MSBuild)
      - name: Build (Windows)
        if: runner.os == 'Windows' && matrix.target == 'native'
        run: sln-build-windows.bat ${{ matrix.arch }}
        shell: cmd

      # Build Linux: GCC
      - name: Build (Linux)
        if: runner.os == 'Linux' && matrix.target == 'native'
        run: |
          chmod +x cmake-build-linux.sh
          ./cmake-build-linux.sh ${{ matrix.arch }}
        shell: bash

      # Build macOS: Clang
      - name: Build (macOS)
        if: runner.os == 'macOS' && matrix.target == 'native'
        run: |
          chmod +x cmake-build-macos.sh
          if [[ "${{ matrix.arch }}" == "x64" ]]; then
            arch -x86_64 ./cmake-build-macos.sh ${{ matrix.arch }}
          else
            ./cmake-build-macos.sh ${{ matrix.arch }}
          fi
        shell: bash

      # Build Android: Linux Android NDK
      - name: Build for Android
        if: runner.os == 'Linux' && matrix.target == 'android'
        run: |
          chmod +x cmake-build-android.sh
          ./cmake-build-android.sh ${{ matrix.arch }}
        shell: bash

      # List Unix
      - name: List Dir (Unix)
        if: runner.os != 'Windows'
        run: find . -type f -o -type d | sort

      # List Windows
      - name: List Dir (Windows)
        if: runner.os == 'Windows'
        run: |
          (Get-ChildItem -Recurse -File).FullName | Sort-Object
        shell: pwsh

      # Upload build artifacts
      - name: Upload artifacts
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.os }}-${{ matrix.target }}-${{ matrix.arch }}
          path: artifacts/
          if-no-files-found: error

  build-gui:
    name: Build Qt GUI (Windows x64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Qt 6 (MinGW)
        run: |
          python -m pip install aqtinstall
          python -m aqt install-qt windows desktop 6.7.3 win64_mingw --outputdir C:\Qt --archives qtbase qttools
          python -m aqt install-tool windows desktop tools_mingw1310 --outputdir C:\Qt

      - name: Configure & Build GUI
        shell: pwsh
        run: |
          $mingw = "C:\Qt\Tools\mingw1310_64\bin"
          $qt = "C:\Qt\6.7.3\mingw_64"
          $env:PATH = "$mingw;$($qt)\bin;$env:PATH"
          cmake -S . -B build-gui -G Ninja `
            -DCMAKE_MAKE_PROGRAM="$mingw\ninja.exe" `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_C_COMPILER="$mingw\gcc.exe" `
            -DCMAKE_CXX_COMPILER="$mingw\g++.exe" `
            -DCMAKE_PREFIX_PATH="$qt" `
            -DBUILD_GUI=ON
          cmake --build build-gui --target Litematic_GUI -j
          & "$qt\bin\windeployqt.exe" --compiler-runtime --release "build-gui\Litematic_GUI\Litematic_GUI.exe"
          New-Item -ItemType Directory -Force -Path dist-gui | Out-Null
          Copy-Item -Recurse -Force "build-gui\Litematic_GUI\*" "dist-gui\"
          Get-ChildItem "dist-gui" -Recurse -Directory | Where-Object { $_.Name -eq 'CMakeFiles' -or $_.Name -eq 'Litematic_GUI_autogen' } | Remove-Item -Recurse -Force
          Get-ChildItem "dist-gui" -File | Where-Object { $_.Extension -in '.cmake','.txt','.ninja','.in' -or $_.Name -like 'build.ninja*' -or $_.Name -eq 'cmake_install.cmake' } | Remove-Item -Force

      - name: Upload GUI artifact
        uses: actions/upload-artifact@v6
        with:
          name: windows-gui-x64
          path: dist-gui/
          if-no-files-found: error

  release:
   needs: [build, build-gui]
   if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
   runs-on: ubuntu-latest
   permissions:
     contents: write
   steps:
     - name: Download all artifacts
       uses: actions/download-artifact@v4
       with:
         path: release-assets
         pattern: "*"
         merge-multiple: true

     - name: List contents of release-assets
       run: |
         cd release-assets/
         find . -type f -o -type d | sort
       shell: bash

     - name: Zip each platform folder
       run: |
         cd release-assets/
         for dir in */; do
           [ -d "$dir" ] || continue
           (cd "$dir" && zip -r "../${dir%/}.zip" .)
         done
       shell: bash

     - name: List zip files
       run: |
         cd release-assets/
         find . -name "*.zip" -type f
       shell: bash

     - name: Upload to Release
       uses: softprops/action-gh-release@v3
       with:
         tag_name: ${{ github.ref_name }}
         name: ${{ github.event.repository.name }} ${{ github.ref_name }}
         files: release-assets/*.zip
       env:
         GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
